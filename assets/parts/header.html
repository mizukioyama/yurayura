<header class="header">
  <style>
    /* Shared header navigation: keep title/date left, navigation on the right. */
    .header > .header-inner > .header-list:not(.header.is-compact.is-open .header-list) {
      position: fixed !important;
      top: 3.5rem !important;
      right: 6rem !important;
      left: auto !important;
      margin: 0 !important;
    }

    /* Keep the divider visually centered between Japanese and English labels. */
    .header .menu-border,
    .footer .menu-border {
      top: 50% !important;
      transform: translateY(-50%) !important;
    }

    /* Give the footer navigation, social icons and copyright distinct spacing. */
    .footer .footer-inner {
      row-gap: 48px !important;
    }
    .footer .footer-social {
      margin-top: 16px !important;
      margin-bottom: 12px !important;
    }
    .footer .footer-copy {
      position: relative !important;
      min-height: 24px;
      margin-top: 20px !important;
    }
    .footer .bottom-txt {
      position: static !important;
      display: block;
      width: max-content;
      max-width: 100%;
      margin: 0 auto;
      transform: none !important;
    }

    /* Gallery PC only: center the English global navigation without viewport fixation. */
    @media screen and (min-width: 1200px) {
      body.gallery-page .header > .header-inner > .header-list:not(.header.is-compact.is-open .header-list) {
        position: absolute !important;
        top: 0 !important;
        right: auto !important;
        bottom: auto !important;
        left: calc(50vw - 6rem) !important;
        margin: 0 !important;
        transform: translateX(-50%) !important;
      }
    }

    @media screen and (max-width: 767px) {
      .header > .header-inner > .header-list:not(.header.is-compact.is-open .header-list) {
        top: var(--site-nav-top, 20px) !important;
        right: var(--site-nav-side, 20px) !important;
        left: auto !important;
      }
      .footer .footer-inner {
        row-gap: 36px !important;
      }
      .footer .footer-social {
        margin-top: 12px !important;
        margin-bottom: 10px !important;
      }
      .footer .footer-copy {
        margin-top: 14px !important;
      }
    }
  </style>

  <nav class="header-inner inner">

    <div class="header-txt">
      <a href="index.html" class="header-logo-link">
        ゆらゆら

        <span class="header-lead">
          体感するArt展
        </span>
      </a>

      <p class="header-date">
        展示期間：10/06(火)～10/12(月)
      </p>
    </div>

    <button
      class="menu-toggle"
      type="button"
      aria-label="メニューを開く"
      aria-expanded="false"
      aria-controls="header-menu"
    >
      <span class="menu-toggle-dot"></span>
      <span class="menu-toggle-dot"></span>
      <span class="menu-toggle-dot"></span>
    </button>

    <ul class="header-list" id="header-menu">

      <li class="header-item header-item--top">
        <a href="./index.html" class="header-link" aria-label="トップ">
          <span class="menu-small">トップ</span>
          <span class="menu-border"></span>
          <span class="menu-en">TOP</span>
        </a>
      </li>

      <li class="header-item header-item--concept">
        <a href="./concept.html" class="header-link" aria-label="世界観">
          <span class="menu-small">世界観</span>
          <span class="menu-border"></span>
          <span class="menu-en">CONCEPT</span>
        </a>
      </li>

      <li class="header-item header-item--gallery">
        <a href="./gallery.html" class="header-link" aria-label="作品">
          <span class="menu-small">作　品</span>
          <span class="menu-border"></span>
          <span class="menu-en">GALLERY</span>
        </a>
      </li>

    </ul>

  </nav>
</header>
