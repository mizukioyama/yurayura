  <style>
    /* Page transition pre-paint cover. Inline on purpose: the
       cover must be in force before the first paint, without
       waiting for an external stylesheet or the deferred shared
       script. The shared script paints its first fog frame over
       this cover and only then lifts it. If the script never
       runs, the failsafe animation lifts the cover on its own,
       so the page can never stay covered. */
    /* The canvas is painted with the site paper colour from
      the first bytes, so an arriving page can never flash
      white before its stylesheets land. This matches
      --color-bg in main.css, which later takes over with
      the same value, so nothing changes once styles land. */
    html {
      background-color: #f3f3ed;
    }
    html.pt-enter::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 200000;
      background: #f5f2e8;
      pointer-events: none;
      animation: pt-cover-failsafe 0.9s ease 1.8s forwards;
    }
    @keyframes pt-cover-failsafe {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      /* The bootstrap script never adds the class in this mode;
         this keeps the cover away even if the class was added
         by other means. */
      html.pt-enter::before {
        animation: none;
        display: none;
      }
    }
  </style>
  <script>
    // Page transition: cover the first paint when arriving from an
    // in-site link (flag written by assets/js/page-transition.js).
    (function () {
      try {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var data = JSON.parse(window.sessionStorage.getItem("yurayura:page-transition") || "null");
        if (!data || Date.now() - data.t > 10000) return;
        var norm = function (p) { return (p || "").replace(/index\.html$/, "").replace(/\/$/, ""); };
        if (norm(data.to) !== norm(window.location.pathname)) return;
        var root = document.documentElement;
        root.classList.add("pt-enter");
        root.style.setProperty("--pt-x", (typeof data.x === "number" ? data.x : 0.5) * 100 + "%");
        root.style.setProperty("--pt-y", (typeof data.y === "number" ? data.y : 0.5) * 100 + "%");
      } catch (error) { /* no cover: the page simply opens */ }
    })();
  </script>
